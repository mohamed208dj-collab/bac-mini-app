<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>BAC PLUS | حسابي</title>

    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Cairo', sans-serif;
            background:
                radial-gradient(circle at top, #172554 0%, #020617 45%, #000 100%);
            color: white;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 390px;
            background: rgba(15, 23, 42, 0.90);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 30px;
            padding: 28px 22px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.45);
        }

        .avatar {
            width: 105px;
            height: 105px;
            object-fit: cover;
            border-radius: 32px;
            border: 4px solid rgba(59,130,246,0.35);
            background: #1e293b;
        }

        .stat {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 18px 10px;
        }

        .debug {
            margin-top: 20px;
            padding: 14px;
            border-radius: 16px;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.06);
            color: #94a3b8;
            font-family: monospace;
            font-size: 11px;
            direction: ltr;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-all;
        }

    </style>
</head>


<body>

<div class="min-h-screen flex items-center justify-center">

    <div class="card text-center">

        <!-- الصورة -->

        <img
            id="user-img"
            class="avatar mx-auto mb-5"
            src="https://ui-avatars.com/api/?name=BAC+PLUS&background=1e293b&color=fff"
            alt="Telegram User"
        >


        <!-- الاسم -->

        <h1
            id="display-name"
            class="text-2xl font-black mb-2"
        >
            جاري التحميل...
        </h1>


        <!-- الحالة -->

        <p
            id="user-status"
            class="text-gray-400 text-xs mb-8"
        >
            جاري التحقق من حسابك...
        </p>


        <!-- المعلومات -->

        <div class="grid grid-cols-2 gap-4">

            <div class="stat">

                <p class="text-gray-400 text-xs mb-2">
                    النقاط
                </p>

                <p
                    id="points"
                    class="text-yellow-400 text-2xl font-black"
                >
                    0
                </p>

            </div>


            <div class="stat">

                <p class="text-gray-400 text-xs mb-2">
                    المعرف
                </p>

                <p
                    id="telegram-id"
                    class="text-blue-400 text-xs font-bold break-all"
                >
                    ---
                </p>

            </div>

        </div>


        <!-- الرجوع -->

        <a
            href="home.html"
            class="block mt-6 w-full py-4 rounded-2xl bg-blue-600 hover:bg-blue-700 transition text-white font-black text-sm"
        >
            العودة للرئيسية
        </a>


        <!-- التشخيص -->

        <div
            id="debug"
            class="debug"
        >
            جاري فحص Telegram...
        </div>

    </div>

</div>


<script>

    /*
    ==========================================
    BAC PLUS
    Telegram Mini App Authentication
    ==========================================
    */


    const API_URL =
        "https://bac-api-vipd.onrender.com";


    const debug =
        document.getElementById("debug");

    const displayName =
        document.getElementById("display-name");

    const userStatus =
        document.getElementById("user-status");

    const points =
        document.getElementById("points");

    const telegramId =
        document.getElementById("telegram-id");

    const userImage =
        document.getElementById("user-img");


    /*
    ==========================================
    التحقق من Telegram
    ==========================================
    */


    if (!window.Telegram) {

        debug.innerText =
            "❌ Telegram غير موجود\n\n" +
            "الصفحة مفتوحة خارج Telegram.";

    }

    else if (!window.Telegram.WebApp) {

        debug.innerText =
            "❌ Telegram WebApp غير موجود\n\n" +
            "هذه الصفحة لم يتم فتحها كـ Mini App.";

    }

    else {

        /*
        Telegram WebApp موجود
        */

        const tg =
            window.Telegram.WebApp;


        /*
        تشغيل Mini App
        */

        tg.ready();

        tg.expand();


        /*
        الحصول على initData
        */

        const initData =
            tg.initData || ""
