<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BAC PLUS | حسابي</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #172b45 0%, #07111f 55%, #030812 100%);
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;

            background: rgba(16, 28, 44, 0.96);

            border: 1px solid rgba(255, 212, 59, 0.12);

            border-radius: 24px;

            padding: 30px 20px;

            text-align: center;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .logo {
            font-size: 30px;
            font-weight: 900;

            color: #ffd43b;

            margin-bottom: 25px;
        }

        .avatar {
            width: 100px;
            height: 100px;

            border-radius: 50%;

            object-fit: cover;

            border: 3px solid #ffd43b;

            background: #243447;

            display: block;

            margin: 0 auto;
        }

        .avatar.hidden {
            display: none;
        }

        .avatar-placeholder {
            width: 100px;
            height: 100px;

            border-radius: 50%;

            margin: 0 auto;

            background: #243447;

            border: 3px solid #ffd43b;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 42px;

            color: #ffd43b;
        }

        .name {
            margin-top: 18px;

            font-size: 23px;

            font-weight: bold;
        }

        .username {
            margin-top: 7px;

            color: #9aa9ba;

            font-size: 15px;
        }

        .points {
            margin-top: 28px;

            padding: 20px;

            border-radius: 17px;

            background: #17263a;
        }

        .points-title {
            color: #9aa9ba;

            font-size: 14px;
        }

        .points-number {
            margin-top: 8px;

            font-size: 34px;

            font-weight: bold;

            color: #ffd43b;
        }

        .status {
            margin-top: 20px;

            font-size: 14px;

            color: #ffd43b;
        }

        .error {
            margin-top: 12px;

            color: #ff6b6b;

            font-size: 13px;

            line-height: 1.7;

            white-space: pre-line;
        }

        .loading {
            color: #9aa9ba;

            font-size: 14px;
        }
    </style>
</head>


<body>

<div class="card">

    <div class="logo">
        BAC PLUS
    </div>


    <!-- صورة المستخدم -->

    <div
        id="avatarPlaceholder"
        class="avatar-placeholder"
    >
        👤
    </div>

    <img
        id="avatar"
        class="avatar hidden"
        alt="Telegram User"
    >


    <!-- الاسم -->

    <div
        id="name"
        class="name"
    >
        جاري التحميل...
    </div>


    <!-- username -->

    <div
        id="username"
        class="username"
    >
    </div>


    <!-- النقاط -->

    <div class="points">

        <div class="points-title">
            النقاط
        </div>

        <div
            id="points"
            class="points-number"
        >
            0
        </div>

    </div>


    <!-- الحالة -->

    <div
        id="status"
        class="status"
    >
        جاري التحقق من حسابك...
    </div>


    <div
        id="error"
        class="error"
    >
    </div>

</div>


<script>

"use strict";


/* =====================================
   رابط الـ API
===================================== */

const API =
    "https://bac-api-vipd.onrender.com";


/* =====================================
   عناصر الصفحة
===================================== */

const nameBox =
    document.getElementById("name");

const usernameBox =
    document.getElementById("username");

const pointsBox =
    document.getElementById("points");

const statusBox =
    document.getElementById("status");

const errorBox =
    document.getElementById("error");

const avatarBox =
    document.getElementById("avatar");

const avatarPlaceholder =
    document.getElementById("avatarPlaceholder");


/* =====================================
   Telegram
===================================== */

function getTelegram() {

    if (
        window.Telegram &&
        window.Telegram.WebApp
    ) {
        return window.Telegram.WebApp;
    }

    return null;
}


/* =====================================
   عرض الخطأ
===================================== */

function showError(message) {

    statusBox.textContent =
        "❌ فشل التحقق";

    statusBox.style.color =
        "#ff6b6b";

    errorBox.textContent =
        message;
}


/* =====================================
   عرض المستخدم
===================================== */

function showUser(user) {

    /*
       إذا عندو username
       نعرضوه

       مثال:
       @souhaib123

       إذا ما عندوش
       نعرض الاسم
    */

    if (user.username) {

        nameBox.textContent =
            "@" + user.username;

        usernameBox.textContent =
            "حساب Telegram";

    } else {

        const fullName =
            (
                user.first_name || ""
            ) +
            " " +
            (
                user.last_name || ""
            );

        nameBox.textContent =
            fullName.trim() ||
            "مستخدم Telegram";

        usernameBox.textContent =
            "حساب Telegram";

    }


    /* النقاط */

    pointsBox.textContent =
        user.points ?? 0;


    /* الصورة */

    if (user.photo_url) {

        avatarBox.src =
            user.photo_url;

        avatarBox.classList.remove(
            "hidden"
        );

        avatarPlaceholder.style.display =
            "none";

    } else {

        avatarBox.classList.add(
            "hidden"
        );

        avatarPlaceholder.style.display =
            "flex";
    }


    /* نجاح */

    statusBox.textContent =
        "✅ تم التحقق من حسابك";

    statusBox.style.color =
        "#52e878";

    errorBox.textContent =
        "";
}


/* =====================================
   تسجيل الدخول
===================================== */

async function login() {


    /* نتأكد من Telegram */

    const tg =
        getTelegram();


    if (!tg) {

        showError(
            "افتح BAC PLUS من داخل Telegram."
        );

        return;
    }


    /* تشغيل Mini App */

    try {

        tg.ready();

        tg.expand();

    } catch (e) {

        console.log(
            "Telegram error:",
            e
        );
    }


    /*
       initData هي البيانات الرسمية
       التي يرسلها Telegram
       للسيرفر للتحقق من الحساب.
    */

    const initData =
        tg.initData || "";


    /* إذا ما وصلتش البيانات */

    if (!initData) {

        showError(
            "Telegram لم يرسل بيانات الحساب.\n\n" +
            "افتح BAC PLUS من زر Open App داخل Telegram."
        );

        return;
    }


    /* حالة التحميل */

    statusBox.textContent =
        "جاري التحقق من حسابك...";

    statusBox.style.color =
        "#ffd43b";


    try {


        /* إرسال بيانات Telegram للسيرفر */

        const response =
            await fetch(
                API + "/api/auth/telegram",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            initData:
                                initData
                        })
                }
            );


        /* قراءة الرد */

        const data =
            await response.json();


        /* خطأ من السيرفر */

        if (!response.ok) {

            showError(
                data.error ||
                "السيرفر رفض التحقق."
            );

            return;
        }


        /* التأكد من نجاح العملية */

        if (
            data.success !== true ||
            !data.user
        ) {

            showError(
                "لم تصل بيانات الحساب من السيرفر."
            );

            return;
        }


        /* عرض الحساب */

        showUser(
            data.user
        );


    } catch (error) {

        console.error(
            error
        );

        showError(
            "تعذر الاتصال بالسيرفر.\n\n" +
            error.message
        );
    }
}


/* =====================================
   تشغيل
===================================== */

login();

</script>

</body>

</html>
