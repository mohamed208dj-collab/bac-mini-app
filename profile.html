<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BAC PLUS | حسابي</title>

    <!-- Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #07111f;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #101c2c;
            border-radius: 22px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,.4);
        }

        h1 {
            margin: 0 0 25px;
            color: #ffd43b;
            font-size: 28px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffd43b;
            background: #243447;
        }

        .name {
            margin-top: 15px;
            font-size: 22px;
            font-weight: bold;
        }

        .username {
            margin-top: 6px;
            color: #9aa9ba;
        }

        .points {
            margin-top: 25px;
            padding: 18px;
            border-radius: 15px;
            background: #17263a;
        }

        .points span {
            display: block;
            color: #9aa9ba;
            font-size: 14px;
        }

        .points strong {
            display: block;
            margin-top: 7px;
            font-size: 30px;
            color: #ffd43b;
        }

        #status {
            margin-top: 20px;
            color: #ffd43b;
        }

        #error {
            margin-top: 15px;
            color: #ff6b6b;
            font-size: 13px;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>BAC PLUS</h1>

    <img
        id="avatar"
        class="avatar"
        src=""
        alt="User"
    >

    <div id="name" class="name">
        جاري التحميل...
    </div>

    <div id="username" class="username"></div>

    <div class="points">
        <span>النقاط</span>
        <strong id="points">0</strong>
    </div>

    <div id="status">
        جاري التحقق من حسابك...
    </div>

    <div id="error"></div>

</div>

<script>

const API = "https://bac-api-vipd.onrender.com";

const statusBox = document.getElementById("status");
const errorBox = document.getElementById("error");
const nameBox = document.getElementById("name");
const usernameBox = document.getElementById("username");
const pointsBox = document.getElementById("points");
const avatarBox = document.getElementById("avatar");

function error(message) {
    statusBox.textContent = "❌ فشل التحقق";
    statusBox.style.color = "#ff6b6b";
    errorBox.textContent = message;
}

async function login() {

    // نتأكد أن Telegram موجود
    if (!window.Telegram || !window.Telegram.WebApp) {
        error(
            "هذه الصفحة لم يتم فتحها كـ Telegram Mini App."
        );
        return;
    }

    const tg = window.Telegram.WebApp;

    // إخبار Telegram أن التطبيق جاهز
    tg.ready();
    tg.expand();

    // بيانات Telegram الأصلية
    const initData = tg.initData;

    // إذا لم تصل البيانات
    if (!initData) {
        error(
            "Telegram لم يرسل initData.\n" +
            "افتح التطبيق من زر Open App داخل Telegram."
        );
        return;
    }

    statusBox.textContent = "جاري التحقق من حسابك...";
    statusBox.style.color = "#ffd43b";

    try {

        const response = await fetch(
            API + "/api/auth/telegram",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    initData: initData
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            error(
                data.error ||
                data.message ||
                "الخادم رفض عملية التحقق."
            );
            return;
        }

        if (!data.ok || !data.user) {
            error("لم تصل بيانات المستخدم من الخادم.");
            return;
        }

        const user = data.user;

        // الاسم
        nameBox.textContent =
            user.first_name ||
            user.username ||
            "مستخدم Telegram";

        // Username
        if (user.username) {
            usernameBox.textContent =
                "@" + user.username;
        } else {
            usernameBox.textContent =
                "Telegram User";
        }

        // النقاط
        pointsBox.textContent =
            user.points ?? 0;

        // الصورة
        if (user.photo_url) {
            avatarBox.src = user.photo_url;
        } else {
            avatarBox.style.display = "none";
        }

        // نجاح
        statusBox.textContent =
            "✅ تم التحقق من حسابك";

        statusBox.style.color = "#52e878";

        errorBox.textContent = "";

    } catch (e) {

        error(
            "تعذر الاتصال بالخادم.\n" +
            e.message
        );
    }
}

// تشغيل المصادقة
login();

</script>

</body>
</html>
