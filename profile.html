<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BAC PLUS | حسابي</title>

    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js?64"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #07111f;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;

            background: #101c2c;

            border-radius: 22px;

            padding: 30px 20px;

            text-align: center;

            box-shadow: 0 10px 40px rgba(0, 0, 0, .4);
        }

        h1 {
            margin: 0 0 25px;

            color: #ffd43b;

            font-size: 28px;
        }

        .avatar {
            width: 90px;
            height: 90px;

            border-radius: 50%;

            object-fit: cover;

            border: 3px solid #ffd43b;

            background: #243447;
        }

        .name {
            margin-top: 15px;

            font-size: 22px;

            font-weight: bold;
        }

        .username {
            margin-top: 6px;

            color: #9aa9ba;
        }

        .points {
            margin-top: 25px;

            padding: 18px;

            border-radius: 15px;

            background: #17263a;
        }

        .points span {
            display: block;

            color: #9aa9ba;

            font-size: 14px;
        }

        .points strong {
            display: block;

            margin-top: 7px;

            font-size: 30px;

            color: #ffd43b;
        }

        #status {
            margin-top: 20px;

            color: #ffd43b;
        }

        #error {
            margin-top: 15px;

            color: #ff6b6b;

            font-size: 13px;

            white-space: pre-line;

            word-break: break-word;

            line-height: 1.7;
        }

        #debug {
            margin-top: 15px;

            padding: 10px;

            border-radius: 10px;

            background: #0b1422;

            color: #8494a8;

            font-size: 11px;

            direction: ltr;

            text-align: left;

            white-space: pre-line;
        }
    </style>
</head>


<body>

<div class="card">

    <h1>BAC PLUS</h1>


    <img
        id="avatar"
        class="avatar"
        alt="User"
    >


    <div
        id="name"
        class="name"
    >
        جاري التحميل...
    </div>


    <div
        id="username"
        class="username"
    ></div>


    <div class="points">

        <span>
            النقاط
        </span>

        <strong id="points">
            0
        </strong>

    </div>


    <div id="status">
        جاري التحقق من حسابك...
    </div>


    <div id="error"></div>


    <div id="debug">
        جاري تشغيل Telegram...
    </div>

</div>


<script>

"use strict";


/* =========================
   إعدادات السيرفر
========================= */

const API =
    "https://bac-api-vipd.onrender.com";


/* =========================
   عناصر الصفحة
========================= */

const statusBox =
    document.getElementById("status");

const errorBox =
    document.getElementById("error");

const debugBox =
    document.getElementById("debug");

const nameBox =
    document.getElementById("name");

const usernameBox =
    document.getElementById("username");

const pointsBox =
    document.getElementById("points");

const avatarBox =
    document.getElementById("avatar");


/* =========================
   إظهار الخطأ
========================= */

function fail(message) {

    statusBox.textContent =
        "❌ فشل التحقق";

    statusBox.style.color =
        "#ff6b6b";

    errorBox.textContent =
        message;
}


/* =========================
   Debug
========================= */

function debug(message) {

    debugBox.textContent =
        message;
}


/* =========================
   انتظار Telegram
========================= */

async function waitForTelegram() {

    for (
        let i = 0;
        i < 50;
        i++
    ) {

        if (
            window.Telegram &&
            window.Telegram.WebApp
        ) {

            return window.Telegram.WebApp;
        }


        await new Promise(
            function(resolve) {

                setTimeout(
                    resolve,
                    100
                );

            }
        );

    }


    return null;
}


/* =========================
   تسجيل الدخول
========================= */

async function login() {


    /* ننتظر Telegram */

    const tg =
        await waitForTelegram();


    /* Telegram غير موجود */

    if (!tg) {

        fail(
            "Telegram WebApp غير موجود.\n\n" +
            "تأكد أنك فتحت BAC PLUS من داخل Telegram."
        );


        debug(
            "Telegram WebApp = NOT FOUND"
        );


        return;
    }


    /* تشغيل Telegram */

    try {

        tg.ready();

        tg.expand();

    } catch (e) {

        console.log(e);

    }


    /* =========================
       أخذ initData
    ========================= */

    const initData =
        tg.initData || "";


    /* معلومات التشخيص */

    debug(

        "Telegram WebApp: OK\n" +

        "Version: " +
        (tg.version || "unknown") +

        "\n" +

        "Platform: " +
        (tg.platform || "unknown") +

        "\n" +

        "initData length: " +
        initData.length

    );


    /* =========================
       إذا Telegram ما عطاش البيانات
    ========================= */

    if (!initData) {

        fail(

            "Telegram لم يرسل بيانات الحساب.\n\n" +

            "هذا يعني أن Mini App مفتوح، " +

            "لكن Telegram لم يرسل initData."

        );


        return;
    }


    /* =========================
       الاتصال بالسيرفر
    ========================= */

    statusBox.textContent =
        "جاري الاتصال بالسيرفر...";


    statusBox.style.color =
        "#ffd43b";


    try {


        const response =
            await fetch(

                API +
                "/api/auth/telegram",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            initData:
                                initData

                        })

                }

            );


        /* =========================
           قراءة الرد
        ========================= */

        let data;


        try {

            data =
                await response.json();

        } catch (e) {

            fail(

                "السيرفر رد برد غير مفهوم.\n\n" +

                "HTTP: " +
                response.status

            );

            return;
        }


        /* =========================
           السيرفر رفض الطلب
        ========================= */

        if (!response.ok) {

            fail(

                data.error ||

                data.message ||

                "السيرفر رفض المصادقة."

            );


            return;
        }


        /* =========================
           التأكد من نجاح تسجيل الدخول
        ========================= */

        if (

            data.success !== true ||

            !data.user

        ) {

            fail(

                "السيرفر اشتغل، " +

                "لكن لم يرجع بيانات المستخدم."

            );


            return;
        }


        /* =========================
           بيانات المستخدم
        ========================= */

        const user =
            data.user;


        /* الاسم */

        nameBox.textContent =

            user.first_name ||

            user.username ||

            "مستخدم Telegram";


        /* username */

        if (user.username) {

            usernameBox.textContent =
                "@" + user.username;

        } else {

            usernameBox.textContent =
                "Telegram User";

        }


        /* النقاط */

        pointsBox.textContent =
            user.points ?? 0;


        /* الصورة */

        if (user.photo_url) {

            avatarBox.src =
                user.photo_url;

        } else {

            avatarBox.style.display =
                "none";

        }


        /* =========================
           نجاح
        ========================= */

        statusBox.textContent =
            "✅ تم التحقق من حسابك";


        statusBox.style.color =
            "#52e878";


        errorBox.textContent =
            "";


        debug(

            "Telegram: OK\n" +

            "Server: OK\n" +

            "Authentication: OK\n" +

            "Telegram ID: " +

            user.telegram_id

        );


    } catch (e) {


        /* =========================
           خطأ الاتصال
        ========================= */

        fail(

            "تعذر الاتصال بالسيرفر.\n\n" +

            e.message

        );


        debug(

            "API ERROR\n" +

            API

        );

    }

}


/* =========================
   تشغيل تسجيل الدخول
========================= */

login();

</script>

</body>

</html>
