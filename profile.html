<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BAC PLUS | حسابي</title>

    <!-- Telegram WebApp: لازم يكون قبل أي JavaScript آخر -->
    <script src="https://telegram.org/js/telegram-web-app.js?64"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #07111f, #102b45);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: rgba(10, 20, 35, 0.95);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 24px;
            padding: 28px 20px;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.4);
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #ffd43b;
            margin-bottom: 20px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            background: #243447;
            border: 3px solid #ffd43b;
            margin-bottom: 15px;
        }

        .name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .username {
            color: #9fb3c8;
            margin-bottom: 20px;
        }

        .points {
            background: rgba(255,212,59,0.12);
            border: 1px solid rgba(255,212,59,0.3);
            border-radius: 15px;
            padding: 15px;
            margin: 20px 0;
        }

        .points-title {
            color: #aaa;
            font-size: 14px;
        }

        .points-value {
            color: #ffd43b;
            font-size: 32px;
            font-weight: bold;
            margin-top: 5px;
        }

        .status {
            font-size: 14px;
            color: #ffd43b;
            margin: 15px 0;
        }

        .debug {
            margin-top: 20px;
            padding: 12px;
            background: #111827;
            border-radius: 12px;
            color: #b8c4d1;
            font-size: 12px;
            text-align: left;
            direction: ltr;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .error {
            color: #ff6b6b;
        }

        .success {
            color: #65e572;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">BAC PLUS</div>

    <img
        id="avatar"
        class="avatar"
        src="https://via.placeholder.com/90"
        alt="Telegram"
    >

    <div id="name" class="name">مستخدم Telegram</div>

    <div id="username" class="username">@username</div>

    <div class="points">
        <div class="points-title">نقاطك</div>
        <div id="points" class="points-value">0</div>
    </div>

    <div id="status" class="status">
        جاري التحقق من حسابك...
    </div>

    <div id="debug" class="debug">
        جاري فحص Telegram...
    </div>

</div>

<script>
(function () {

    const API_URL = "https://bac-api-vipd.onrender.com";

    const debug = document.getElementById("debug");
    const status = document.getElementById("status");
    const nameElement = document.getElementById("name");
    const usernameElement = document.getElementById("username");
    const pointsElement = document.getElementById("points");
    const avatarElement = document.getElementById("avatar");

    function showDebug(message, type = "") {
        debug.className = "debug " + type;
        debug.textContent = message;
    }

    function showError(message) {
        status.textContent = message;
        status.className = "status error";
    }

    async function loginToServer(initData) {

        status.textContent = "جاري الاتصال بالخادم...";
        status.className = "status";

        try {

            const response = await fetch(
                API_URL + "/api/auth/telegram",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        initData: initData
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {

                showError("❌ فشل التحقق من الحساب");

                showDebug(
                    "HTTP ERROR: " + response.status +
                    "\n\n" +
                    JSON.stringify(data, null, 2),
                    "error"
                );

                return;
            }

            if (!data.ok || !data.user) {

                showError("❌ لم يتم العثور على بيانات الحساب");

                showDebug(
                    JSON.stringify(data, null, 2),
                    "error"
                );

                return;
            }

            const user = data.user;

            nameElement.textContent =
                user.first_name ||
                user.username ||
                "مستخدم Telegram";

            usernameElement.textContent =
                user.username
                    ? "@" + user.username
                    : "بدون اسم مستخدم";

            pointsElement.textContent =
                user.points ?? 0;

            if (user.photo_url) {
                avatarElement.src = user.photo_url;
            }

            status.textContent = "✅ تم التحقق من حسابك";
            status.className = "status success";

            showDebug(
                "✅ تم تسجيل الدخول بنجاح" +
                "\n\nTelegram ID: " + user.telegram_id +
                "\nالاسم: " + (user.first_name || "") +
                "\nUsername: " + (user.username || "بدون") +
                "\nالنقاط: " + (user.points ?? 0),
                "success"
            );

        } catch (error) {

            showError("❌ حدث خطأ في الاتصال بالخادم");

            showDebug(
                "ERROR:\n" + error.message +
                "\n\nAPI:\n" + API_URL,
                "error"
            );
        }
    }

    function startTelegram() {

        showDebug("جاري فحص Telegram...");

        if (!window.Telegram) {

            showError("❌ Telegram غير موجود");

            showDebug(
                "window.Telegram غير موجود\n\n" +
                "هذه الصفحة لم يتم تحميل Telegram WebApp.",
                "error"
            );

            return;
        }

        if (!window.Telegram.WebApp) {

            showError("❌ Telegram WebApp غير موجود");

            showDebug(
                "window.Telegram موجود\n" +
                "لكن Telegram.WebApp غير موجود.",
                "error"
            );

            return;
        }

        const tg = window.Telegram.WebApp;

        try {
            tg.ready();
            tg.expand();
        } catch (e) {
            console.log(e);
        }

        const initData = tg.initData || "";

        showDebug(
            "✅ Telegram WebApp موجود" +
            "\n\n" +
            "initData length = " + initData.length +
            "\n\n" +
            "version = " + (tg.version || "unknown") +
            "\n\n" +
            "platform = " + (tg.platform || "unknown")
        );

        if (!initData) {

            status.textContent =
                "❌ Telegram لم يرسل بيانات الحساب";

            status.className = "status error";

            showDebug(
                "✅ Telegram WebApp موجود" +
                "\n\n" +
                "initData length = 0" +
                "\n\n" +
                "هذا يعني أن Telegram فتح الصفحة، " +
                "لكن بيانات الجلسة لم تصل.",
                "error"
            );

            return;
        }

        loginToServer(initData);
    }

    /*
       نعطي Telegram وقت صغير باش يكمل تهيئة WebApp
       ثم نبدأ الفحص.
    */
    if (document.readyState === "loading") {

        document.addEventListener(
            "DOMContentLoaded",
            function () {
                setTimeout(startTelegram, 300);
            }
        );

    } else {

        setTimeout(startTelegram, 300);

    }

})();
</script>

</body>
</html>
