<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BAC PLUS | حسابي</title>

    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #07111f;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #101c2c;
            border-radius: 22px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,.4);
        }

        h1 {
            margin: 0 0 25px;
            color: #ffd43b;
            font-size: 28px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffd43b;
            background: #243447;
        }

        .name {
            margin-top: 15px;
            font-size: 22px;
            font-weight: bold;
        }

        .username {
            margin-top: 6px;
            color: #9aa9ba;
        }

        .points {
            margin-top: 25px;
            padding: 18px;
            border-radius: 15px;
            background: #17263a;
        }

        .points span {
            display: block;
            color: #9aa9ba;
            font-size: 14px;
        }

        .points strong {
            display: block;
            margin-top: 7px;
            font-size: 30px;
            color: #ffd43b;
        }

        #status {
            margin-top: 20px;
            color: #ffd43b;
        }

        #error {
            margin-top: 15px;
            color: #ff6b6b;
            font-size: 13px;
            white-space: pre-line;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>BAC PLUS</h1>

    <img
        id="avatar"
        class="avatar"
        alt="User"
    >

    <div id="name" class="name">
        جاري التحميل...
    </div>

    <div id="username" class="username"></div>

    <div class="points">
        <span>النقاط</span>
        <strong id="points">0</strong>
    </div>

    <div id="status">
        جاري التحقق من حسابك...
    </div>

    <div id="error"></div>

</div>

<script>
"use strict";

const API = "https://bac-api-vipd.onrender.com";

const statusBox = document.getElementById("status");
const errorBox = document.getElementById("error");
const nameBox = document.getElementById("name");
const usernameBox = document.getElementById("username");
const pointsBox = document.getElementById("points");
const avatarBox = document.getElementById("avatar");


function showError(message) {

    statusBox.textContent = "❌ فشل التحقق";
    statusBox.style.color = "#ff6b6b";

    errorBox.textContent = message;
}


function showSuccess(message) {

    statusBox.textContent = message;
    statusBox.style.color = "#52e878";

    errorBox.textContent = "";
}


async function loginWithTelegram() {

    /*
     * ننتظر قليلاً حتى يكون Telegram WebApp
     * جاهزاً داخل Mini App.
     */

    let attempts = 0;

    while (
        (!window.Telegram || !window.Telegram.WebApp) &&
        attempts < 30
    ) {

        await new Promise(resolve =>
            setTimeout(resolve, 100)
        );

        attempts++;
    }


    /*
     * Telegram غير موجود
     */

    if (!window.Telegram) {

        showError(
            "Telegram غير موجود.\n\n" +
            "تأكد أنك فتحت BAC PLUS من داخل Telegram."
        );

        return;
    }


    /*
     * Telegram موجود لكن WebApp غير موجود
     */

    if (!window.Telegram.WebApp) {

        showError(
            "Telegram موجود لكن WebApp غير موجود.\n\n" +
            "افتح المنصة من زر Open App داخل Telegram."
        );

        return;
    }


    const tg = window.Telegram.WebApp;


    /*
     * نخبر Telegram أن التطبيق جاهز
     */

    try {
        tg.ready();
        tg.expand();
    } catch (e) {
        console.log("Telegram ready error:", e);
    }


    /*
     * هذه هي بيانات Telegram الأصلية.
     * لا نستعمل initDataUnsafe للمصادقة.
     */

    const initData = tg.initData || "";


    /*
     * Telegram لم يرسل بيانات المستخدم
     */

    if (!initData) {

        showError(
            "Telegram لم يرسل بيانات الحساب.\n\n" +
            "افتح BAC PLUS من زر Open App داخل Telegram."
        );

        return;
    }


    /*
     * بدأ الاتصال بالسيرفر
     */

    statusBox.textContent =
        "جاري الاتصال بالسيرفر...";

    statusBox.style.color = "#ffd43b";


    try {

        const response = await fetch(
            API + "/api/auth/telegram",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    initData: initData
                })
            }
        );


        /*
         * نحاول قراءة رد السيرفر
         */

        let data;

        try {
            data = await response.json();
        } catch (e) {

            showError(
                "السيرفر رد برد غير مفهوم.\n\n" +
                "HTTP: " + response.status
            );

            return;
        }


        /*
         * السيرفر رفض المصادقة
         */

        if (!response.ok) {

            showError(
                data.error ||
                data.message ||
                "السيرفر رفض عملية التحقق.\n\n" +
                "HTTP: " + response.status
            );

            return;
        }


        /*
         * التأكد من وجود المستخدم
         */

        if (!data.ok || !data.user) {

            showError(
                "السيرفر اشتغل، لكن لم يرجع بيانات المستخدم."
            );

            return;
        }


        const user = data.user;


        /*
         * الاسم
         */

        nameBox.textContent =
            user.first_name ||
            user.username ||
            "مستخدم Telegram";


        /*
         * Username
         */

        usernameBox.textContent =
            user.username
                ? "@" + user.username
                : "Telegram User";


        /*
         * النقاط
         */

        pointsBox.textContent =
            user.points ?? 0;


        /*
         * صورة الحساب
         */

        if (user.photo_url) {

            avatarBox.src = user.photo_url;

        } else {

            avatarBox.style.display = "none";
        }


        /*
         * نجاح
         */

        showSuccess(
            "✅ تم التحقق من حسابك"
        );

    } catch (e) {

        showError(
            "تعذر الاتصال بالسيرفر.\n\n" +
            e.message
        );
    }
}


/*
 * تشغيل المصادقة
 */

loginWithTelegram();

</script>

</body>
</html>
